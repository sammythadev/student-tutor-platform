<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tutorly">
  <defs>
    <!-- Canvas: the dark room the beam lights. -->
    <linearGradient id="canvas" x1="90" y1="0" x2="90" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <!-- Beam: fades in from the top edge, brightest where it lands. -->
    <linearGradient id="beam" x1="90" y1="24" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6AA6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8AB4FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F2F7FF"/>
    </linearGradient>
    <!-- Rim: the struck edge, hottest at centre. -->
    <linearGradient id="rim" x1="24" y1="112" x2="156" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6AA6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2F7FF"/>
      <stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </linearGradient>
    <!-- Haze hanging in the air just above the strike. -->
    <radialGradient id="haze" cx="0.5" cy="1" r="0.72">
      <stop offset="0" stop-color="#6AA6FF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#6AA6FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6AA6FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle"><rect width="180" height="180" rx="40"/></clipPath>
    <!-- Confines the haze to the air above the rim: no glow spills below it. -->
    <clipPath id="aboveRim"><rect x="0" y="0" width="180" height="110"/></clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="180" height="180" fill="url(#canvas)"/>

    <g clip-path="url(#aboveRim)">
      <ellipse cx="90" cy="110" rx="60" ry="30" fill="url(#haze)"/>
      <path d="M86.6 24 H93.4 L96.2 110 H83.8 Z" fill="url(#beam)"/>
    </g>

    <!-- The struck rim -->
    <rect x="24" y="110" width="132" height="4" rx="2" fill="url(#rim)"/>

    <!-- The lit plate below: the ranked result the beam reveals -->
    <rect x="52" y="134" width="76" height="8" rx="4" fill="#8AB4FF" fill-opacity="0.62"/>
    <rect x="52" y="152" width="42" height="8" rx="4" fill="#8AB4FF" fill-opacity="0.26"/>
  </g>
</svg>
